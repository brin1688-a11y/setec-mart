server {
    listen 80;
    listen [::]:80;

    server_name {{DOMAIN}};
    root {{APP_DIR}}/public;

    index index.php;
    charset utf-8;

    # A full product gallery is 10 images at 4MB. The 1MB default would turn
    # that into a silent 413 halfway through the upload.
    client_max_body_size 48M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php{{PHP_VERSION}}-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # KHQR webhooks and the Gemini chat call both outlive the 60s default.
        fastcgi_read_timeout 120;
    }

    # Product photos live under storage/app/public, reached through the
    # public/storage symlink. Let nginx serve them straight off disk.
    location ^~ /storage/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Never serve the environment file or version control, whatever else
    # happens to the document root.
    location ~ /\.(?!well-known).* { deny all; }

    error_page 404 /index.php;
    access_log /var/log/nginx/setec-mart.access.log;
    error_log  /var/log/nginx/setec-mart.error.log;
}
