; The queue worker that finishes KHQR payments. Without it a webhook from
; CutLuy lands in the jobs table and sits there, so an order stays Pending
; even though the customer has paid.
;
; Installed to /etc/supervisor/conf.d/setec-worker.conf by setup-server.sh.

[program:setec-worker]
process_name=%(program_name)s_%(process_num)02d
command=php {{APP_DIR}}/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory={{APP_DIR}}
user=www-data
numprocs=1
autostart=true
autorestart=true
; Let a job finish rather than killing it mid-payment on restart.
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile={{APP_DIR}}/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
